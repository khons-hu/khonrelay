plugins { id 'com.android.application' }
// Signing material is outside this repository and never committed.
def signingPath = System.getenv('KHONSU_SIGNING_PROPERTIES')
def signing = new Properties()
if (signingPath) { file(signingPath).withInputStream { signing.load(it) } }
android {
    namespace 'dev.khonsu.khonrelay'
    compileSdk 36
    defaultConfig {
        applicationId 'dev.khonsu.khonrelay'
        minSdk 26
        targetSdk 36
        versionCode 1
        versionName '1.0.0-preview.1'
    }
    signingConfigs {
        release {
            if (signingPath) {
                storeFile file(signing['storeFile'])
                storePassword signing['storePassword']
                keyAlias signing['keyAlias']
                keyPassword signing['keyPassword']
            }
        }
    }
    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
dependencies { implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.7.3' }
